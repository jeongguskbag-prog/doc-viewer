<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Viewer</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d1f23; --muted: #6b7280;
    --border: #e2e5ea; --accent: #2563eb; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #15171c; --panel: #1f2229; --text: #e6e8ec; --muted: #9aa3b2; --border: #2e333d; --accent: #60a5fa; --warn: #fbbf24; }
  }
  :root[data-theme="dark"] { --bg: #15171c; --panel: #1f2229; --text: #e6e8ec; --muted: #9aa3b2; --border: #2e333d; --accent: #60a5fa; --warn: #fbbf24; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Malgun Gothic", "Hiragino Sans", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; margin-right: auto; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  select.lang { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; }
  input[type=search] { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 180px; }
  main { flex: 1; display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
  aside { background: var(--panel); border-right: 1px solid var(--border); overflow: auto; padding: 12px; }
  aside.links { border-right: 0; border-left: 1px solid var(--border); }
  aside h2 { font-size: 13px; color: var(--muted); margin: 6px 0 8px; font-weight: 600; }
  .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  .file-item { padding: 8px; border-radius: 6px; cursor: pointer; font-size: 13px; word-break: break-all; }
  .file-item:hover, .file-item.active { background: var(--bg); }
  .file-item small { display: block; color: var(--muted); }
  #viewer { overflow: auto; padding: 24px; min-width: 0; }
  #content { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; min-height: 80vh; max-width: 900px; margin: 0 auto; overflow: auto; }
  #content img { max-width: 100%; }
  #content table { border-collapse: collapse; font-size: 13px; }
  #content td, #content th { border: 1px solid var(--border); padding: 4px 8px; }
  #content pre { background: var(--bg); padding: 12px; overflow: auto; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  #content a { color: #2563eb; text-decoration: underline; text-underline-offset: 2px; word-break: break-all; cursor: pointer; }
  :root[data-theme="dark"] #content a:not(.xl-grid a) { color: #60a5fa; }
  /* PDF 링크: 캔버스 위 투명 상자. screen 합성으로 검은 글자를 파랗게 보이게 함 */
  #content a.pdf-link { position: absolute; display: block; background: #2563eb; mix-blend-mode: screen; border-bottom: 2px solid #2563eb; text-decoration: none; }

  /* ---------- 문서 창 오른쪽 위 도구 (전체 보기·번역) / 전체 화면 ---------- */
  #viewTools { position: sticky; top: 8px; z-index: 20; display: flex; justify-content: flex-end; gap: 6px; height: 0; margin: 0 auto; max-width: 900px; pointer-events: none; }
  #viewTools > * { pointer-events: auto; }
  #viewTools button { height: 36px; border-radius: 18px; padding: 0 12px; background: rgba(17,24,39,.78); color: #fff; border: 0; font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,.2); transform: translate(-8px, 8px); }
  #viewTools .fs-only { display: none; }
  body.fs #viewTools { position: fixed; top: 10px; right: 10px; left: 10px; height: auto; max-width: none; flex-wrap: wrap; }
  body.fs #viewTools button { transform: none; min-width: 40px; }
  body.fs #viewTools .fs-only { display: inline-block; }
  body.fs #viewTools .nofs { display: none; }
  #trMenu { position: absolute; right: 8px; top: 50px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 6px; min-width: 180px; }
  body.fs #trMenu { top: 46px; right: 0; }
  #trMenu button { display: block; width: 100%; text-align: left; background: transparent; color: var(--text); border: 0; border-radius: 6px; padding: 9px 10px; font-size: 14px; transform: none; box-shadow: none; height: auto; }
  #trMenu button:hover, #trMenu button.on { background: var(--bg); }
  #trMenu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
  #trStatus { font-size: 12px; color: var(--muted); padding: 4px 10px; }
  .tr-pages { max-width: 820px; margin: 0 auto; }
  .tr-page { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px; margin-bottom: 14px; line-height: 1.6; }
  .tr-page h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .tr-page p { margin: 0 0 6px; }
  #fsBar { display: none; }
  body.fs header, body.fs main > aside { display: none; }
  body.fs #viewer { position: fixed; inset: 0; z-index: 50; padding: 0; background: var(--bg); overflow: auto; }
  body.fs #content { max-width: none; min-height: 100%; border: 0; border-radius: 0; margin: 0; }
  body.fs #content, body.fs #content.sheet-mode { padding-top: 56px; } /* 위쪽 버튼 줄에 가리지 않게 */


  /* ---------- 엑셀 보기 (열 머리글·행 번호·수식 입력줄·시트 탭) ---------- */
  #content.sheet-mode { padding: 0; max-width: none; display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 60vh; overflow: hidden; }
  body.fs #content.sheet-mode { height: 100vh; }
  .xl-bar { display: flex; align-items: center; gap: 0; border-bottom: 1px solid #d4d4d4; background: #fff; color: #000; font-size: 13px; flex: 0 0 auto; }
  .xl-bar .addr { width: 72px; padding: 6px 8px; border-right: 1px solid #d4d4d4; text-align: center; font-family: Consolas, monospace; }
  .xl-bar .fx { padding: 6px 8px; color: #6b7280; font-style: italic; border-right: 1px solid #d4d4d4; }
  .xl-bar .val { padding: 6px 8px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xl-grid { flex: 1; overflow: auto; background: #fff; -webkit-overflow-scrolling: touch; }
  #content .xl-grid table { border-collapse: separate; border-spacing: 0; table-layout: fixed; font: 13px Calibri, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #000; }
  #content .xl-grid td { border: 0; border-right: 1px solid #e1e1e1; border-bottom: 1px solid #e1e1e1; padding: 1px 4px; white-space: nowrap; overflow: hidden; background: #fff; vertical-align: bottom; }
  #content .xl-grid td.num { text-align: right; }
  #content .xl-grid td.ctr { text-align: center; }
  #content .xl-grid td.sel { outline: 2px solid #107c41; outline-offset: -2px; }
  #content .xl-grid th { background: #f3f3f3; color: #444; font-weight: 400; font-size: 12px; border: 0; border-right: 1px solid #c8c8c8; border-bottom: 1px solid #c8c8c8; padding: 0 2px; position: sticky; z-index: 1; text-align: center; height: 22px; }
  #content .xl-grid thead th { top: 0; z-index: 2; }
  #content .xl-grid tbody th { left: 0; }
  #content .xl-grid thead th.corner { left: 0; z-index: 3; }
  #content .xl-grid th.hl { background: #d3f0e0; color: #107c41; font-weight: 600; }
  #content .xl-grid tbody tr { height: 22px; }
  /* 칸 크기 조절 손잡이: 열 머리글 오른쪽 끝 / 행 번호 아래쪽 끝 (손가락으로도 잡히게 넉넉히) */
  .xl-grid .rz { position: absolute; z-index: 4; touch-action: none; }
  .xl-grid .rz-c { top: 0; right: 0; width: 14px; height: 100%; cursor: col-resize; }
  .xl-grid .rz-r { left: 0; bottom: 0; height: 12px; width: 100%; cursor: row-resize; }
  .xl-grid .rz::after { content: ""; position: absolute; background: #107c41; opacity: 0; }
  .xl-grid .rz-c::after { right: 0; top: 0; bottom: 0; width: 3px; }
  .xl-grid .rz-r::after { left: 0; right: 0; bottom: 0; height: 3px; }
  .xl-grid .rz:hover::after, .xl-grid .rz.active::after { opacity: 1; }
  .rz-tip { position: fixed; z-index: 70; background: #111827; color: #fff; font-size: 12px; padding: 3px 7px; border-radius: 4px; pointer-events: none; }
  .xl-note { padding: 6px 10px; font-size: 12px; color: #92400e; background: #fffbeb; border-bottom: 1px solid #fde68a; }
  .xl-tabs { display: flex; overflow-x: auto; background: #f3f3f3; border-top: 1px solid #c8c8c8; flex: 0 0 auto; }
  .xl-tab { background: transparent; color: #333; border: 0; border-right: 1px solid #d4d4d4; border-radius: 0; padding: 9px 16px; white-space: nowrap; font-size: 13px; }
  .xl-tab.active { background: #fff; color: #107c41; font-weight: 600; box-shadow: inset 0 -3px 0 #107c41; }
  img.hwp-img { max-width: 100%; height: auto; }
  .pdf-wrap { position: relative; width: fit-content; max-width: 100%; margin: 0 auto 16px; }
  .pdf-wrap .pdf-page { margin: 0; }
  .pdf-hit { position: absolute; background: rgba(253,224,71,.45); pointer-events: none; border-radius: 2px; }
  .pdf-hit.current { background: rgba(251,146,60,.55); outline: 2px solid #ea580c; }
  mark.hit { background: #fde047; color: inherit; border-radius: 2px; }
  mark.hit.current { background: #fb923c; outline: 2px solid #ea580c; }
  .pdf-page { display: block; margin: 0 auto 16px; box-shadow: 0 1px 4px rgba(0,0,0,.15); max-width: 100%; }
  .link-item { padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .link-item .label { font-weight: 600; word-break: break-all; }
  .link-item .url { color: var(--muted); word-break: break-all; margin: 2px 0 6px; }
  .link-item .tag { font-size: 11px; color: var(--warn); margin-top: 2px; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 8px; text-align: center; }
  .error { color: #dc2626; padding: 12px; }
  .blocked-img { display: inline-block; padding: 8px 10px; border: 1px dashed var(--border); border-radius: 6px; color: var(--muted); font-size: 12px; word-break: break-all; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    aside { max-height: 30vh; border: 0; border-bottom: 1px solid var(--border); }
    aside.links { border-top: 1px solid var(--border); }
  }
  /* 휴대폰 폭: 좌우 여백 16px, 검색창은 한 줄 전체 사용 */
  @media (max-width: 600px) {
    #viewer { padding: 16px; }
    #docSearch { flex: 1 1 100%; width: 100%; }
    header h1 { font-size: 18px; margin-right: auto; }
    aside { padding: 12px 16px; }
  }
</style>
</head>
<body>

<header>
  <h1 data-i18n="app.heading">📄 Document Viewer</h1>
  <input type="search" id="docSearch" data-i18n-placeholder="header.search" placeholder="Search text in document" disabled>
  <span id="matchInfo" style="font-size:13px;color:var(--muted)"></span>
  <button class="ghost" id="zoomOut" disabled>A−</button>
  <button class="ghost" id="zoomIn" disabled>A+</button>
  <button class="ghost" id="codeBtn" data-i18n="header.code">🔲 Codes</button>
  <button class="ghost" id="exportBtn" data-i18n="header.export" disabled>📤 Export</button>
  <button class="ghost" id="darkToggle" data-i18n="header.theme">🌓 Theme</button>
  <select class="lang" id="langSel" aria-label="Language">
    <option value="ko">한국어</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
  </select>
</header>

<dialog id="codeDialog" style="width:min(560px,92vw);border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:16px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <strong data-i18n="code.title">🔲 Barcodes & QR codes</strong>
    <button class="ghost" id="codeClose" data-i18n="code.close">Close</button>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:12px">
    <button class="tabBtn" data-tab="read" data-i18n="code.tabRead">Read</button>
    <button class="tabBtn ghost" data-tab="make" data-i18n="code.tabMake">Create</button>
  </div>

  <section id="tabRead">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="ghost" id="readCurrent" data-i18n="code.readCurrent">Read from current document</button>
      <button class="ghost" id="readFileBtn" data-i18n="code.readFile">Read from image file</button>
      <input type="file" id="readFile" accept="image/*" hidden>
      <button id="scanBtn" data-i18n="code.scanCamera">📷 Scan with camera</button>
    </div>
    <div id="scanBox" hidden style="margin-bottom:10px">
      <div style="position:relative;background:#000;border-radius:8px;overflow:hidden">
        <video id="scanVideo" playsinline muted autoplay style="display:block;width:100%;max-height:55vh;object-fit:cover"></video>
        <div style="position:absolute;inset:18% 12%;border:3px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.25);pointer-events:none"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
        <button class="ghost" id="scanStop" data-i18n="code.scanStop">Stop scanning</button>
        <button class="ghost" id="scanTorch" hidden data-i18n="code.cam.torch">🔦 Flash</button>
        <span style="font-size:12px;color:var(--muted)" data-i18n="code.scanHint">Center the code in the frame.</span>
      </div>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px" data-i18n="code.readHint">Finds QR codes and barcodes in images and PDF pages.</div>
    <div id="readResults"></div>
  </section>

  <section id="tabMake" hidden>
    <select id="codeType" style="padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:8px;max-width:100%"></select>
    <textarea id="codeText" rows="3" data-i18n-placeholder="code.placeholder" placeholder="e.g. https://example.com" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)"></textarea>
    <div style="display:flex;gap:8px;margin:8px 0">
      <button id="makeBtn" data-i18n="code.make">Create</button>
      <button class="ghost" id="makeDownload" disabled data-i18n="code.download">Save PNG</button>
    </div>
    <div id="makeMsg" style="color:#dc2626;font-size:13px;min-height:18px"></div>
    <div id="makePreview" style="background:#fff;padding:10px;border-radius:6px;text-align:center;min-height:40px"></div>
  </section>
</dialog>

<dialog id="exportDialog" style="width:min(520px,92vw);border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:16px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <strong data-i18n="export.title">📤 Export · Print · Send</strong>
    <button class="ghost" id="exportClose" data-i18n="export.close">Close</button>
  </div>
  <label for="exportFormat" style="font-size:13px;color:var(--muted)" data-i18n="export.format">Format</label>
  <select id="exportFormat" style="display:block;width:100%;margin:4px 0 12px;padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text)"></select>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button id="exportRun" data-i18n="export.run">Export</button>
    <button class="ghost" id="exportPrint" data-i18n="export.print">Print</button>
    <button class="ghost" id="exportSend" data-i18n="export.send">Send by mail / share</button>
    <button class="ghost" id="exportFax" data-i18n="export.fax">Send by fax</button>
  </div>
  <div id="exportMsg" role="status" style="font-size:13px;line-height:1.5;margin-top:12px;min-height:18px;color:var(--muted)"></div>
</dialog>

<main>
  <aside>
    <div class="drop" id="dropZone">
      <span data-i18n="drop.text">Drop files here or</span><br>
      <button id="pickBtn" style="margin-top:8px" data-i18n="drop.pick">Choose files</button>
      <input type="file" id="fileInput" multiple hidden
        accept=".pdf,.hwp,.docx,.xlsx,.xls,.csv,.md,.txt,.png,.jpg,.jpeg,.gif,.webp">
    </div>
    <h2 data-i18n="list.recent">Opened documents</h2>
    <div id="fileList"><div class="empty" data-i18n="list.empty">No documents opened yet</div></div>
  </aside>

  <section id="viewer">
    <div id="viewTools" hidden>
      <button id="trBtn" data-i18n="tr.button">🌐 Translate</button>
      <button class="fs-only" id="fsExport" data-i18n="fs.export">📤 Export</button>
      <button class="fs-only" id="fsOut" aria-label="zoom out">A−</button>
      <button class="fs-only" id="fsIn" aria-label="zoom in">A+</button>
      <button class="nofs" id="fsBtn" data-i18n="view.full">⛶ Full view</button>
      <button class="fs-only" id="fsClose" aria-label="close">✕</button>
      <div id="trMenu" hidden>
        <button data-tr="ko">한국어</button>
        <button data-tr="en">English</button>
        <button data-tr="zh-CN">中文 (简体)</button>
        <button data-tr="ja">日本語</button>
        <button data-tr="" data-i18n="tr.original">Original</button>
        <hr>
        <button id="trSettings" data-i18n="tr.settings">⚙ Translation engine</button>
        <div id="trStatus"></div>
      </div>
    </div>
    <div id="content"><div class="empty"><span data-i18n="viewer.pick">Select a file on the left.</span><br><span data-i18n="viewer.supported">Supported: PDF, HWP, DOCX, XLSX, CSV, MD, TXT, images</span></div></div>
  </section>

</main>

<!-- 문서 읽기 라이브러리: 앱 안에 포함 (인터넷 없이 동작). scripts/vendor-libs.js 가 채움 -->
<script src="lib/pdfjs/pdf.min.js"></script>
<script src="lib/mammoth.browser.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/marked.min.js"></script>
<script src="lib/purify.min.js"></script>
<script src="vendor/hwp-bridge.js"></script>
<script src="vendor/codes.js"></script>
<script src="vendor/export.js"></script>
<script src="i18n/ko.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/ja.js"></script>

<script>
(() => {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdfjs/pdf.worker.min.js";
  // 한글·한자·일본어 글꼴(CID) PDF 가 깨지지 않도록 CMap·표준 글꼴을 앱 안에서 불러옴
  // (상대 경로는 worker 기준으로 풀려 404가 나므로 절대 URL 로 지정)
  const libUrl = (p) => new URL(p, location.href).href;
  const PDF_OPTS = { cMapUrl: libUrl("lib/pdfjs/cmaps/"), cMapPacked: true, standardFontDataUrl: libUrl("lib/pdfjs/standard_fonts/") };

  // ---------- 언어 ----------
  // 새 언어 추가: i18n/xx.js 작성 → 아래 LANGS 와 헤더 select 에 항목 추가
  const LANGS = ["ko", "en", "ja"];
  const I18N = window.I18N;

  function detectLang() {
    try {
      const saved = localStorage.getItem("viewer.lang");
      if (saved && LANGS.includes(saved)) return saved;
    } catch { /* 저장소 사용 불가 시 무시 */ }
    const browser = (navigator.language || "en").slice(0, 2).toLowerCase();
    return LANGS.includes(browser) ? browser : "en";
  }

  let lang = detectLang();

  function t(key, vars) {
    const dict = I18N[lang] || {};
    let s = dict[key] ?? I18N.ko[key] ?? key;
    if (vars) for (const k in vars) s = s.split("{" + k + "}").join(String(vars[k]));
    return s;
  }

  function applyI18n(root = document) {
    root.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    root.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  }

  function setLanguage(next) {
    if (!LANGS.includes(next)) return;
    lang = next;
    try { localStorage.setItem("viewer.lang", next); } catch { /* 무시 */ }
    document.documentElement.lang = lang;
    document.title = t("app.title");
    $("langSel").value = lang;
    applyI18n();
    rebuildCodeTypes();
    renderFileList();
    renderLinkList();
  }

  // ---------- 공통 ----------
  const ALLOWED_PROTOCOLS = ["http:", "https:", "mailto:", "tel:"];
  const SHORTENERS = ["bit.ly", "me2.do", "tinyurl.com", "goo.gl", "t.co", "url.kr"];

  const state = { files: [], current: null, zoom: 1, rawText: null, links: [], linkStatus: "idle", renderId: 0, pdfPages: null, pdfHits: [], pdfCursor: -1 };
  let hitMarks = [];   // 텍스트 문서 검색 결과 (<mark class="hit">)
  let hitIndex = -1;
  const $ = (id) => document.getElementById(id);
  const content = $("content");

  // 브리지 오류(코드) → 현재 언어 문구
  function hwpErrorText(err) {
    const map = { notHwp: "error.hwpNotHwp", encrypted: "error.hwpEncrypted", unsupported: "error.hwpUnsupported", corrupt: "error.hwpCorrupt" };
    return err && map[err.code] ? t(map[err.code], err.params) : (err && err.message) || String(err);
  }
  function codeErrorText(err) {
    return err && err.code ? t("code.err." + err.code, err.params) : (err && err.message) || String(err);
  }

  // ---------- 파일 목록 ----------
  const dropZone = $("dropZone");
  dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault(); dropZone.classList.remove("over");
    addFiles(e.dataTransfer.files);
  });
  $("pickBtn").addEventListener("click", () => $("fileInput").click());
  $("fileInput").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
  $("langSel").addEventListener("change", (e) => setLanguage(e.target.value));

  // ---------- 다른 앱(카카오톡·Gmail·내 파일)에서 연 문서 받기 ----------
  // 네이티브 FileIntentPlugin 이 파일을 앱 캐시에 복사한 뒤 fileOpened 이벤트로 경로를 알려 줌
  (function initNativeOpen() {
    const cap = window.Capacitor;
    if (!cap || !cap.isNativePlatform || !cap.isNativePlatform() || !cap.addListener) return;
    cap.addListener("FileIntent", "fileOpened", async (ev) => {
      if (!ev) return;
      if (ev.error || !ev.path) {
        content.innerHTML = `<div class="error">${escapeHtml(t("open.nativeFail", { msg: ev.error || "" }))}</div>`;
        return;
      }
      try {
        const res = await fetch(cap.convertFileSrc(ev.path));
        if (!res.ok) throw new Error("HTTP " + res.status);
        const blob = await res.blob();
        addFiles([new File([blob], ev.name, { type: ev.mime || blob.type })]);
      } catch (e) {
        content.innerHTML = `<div class="error">${escapeHtml(t("open.nativeFail", { msg: e.message }))}</div>`;
      }
    });
  })();

  function addFiles(fileList) {
    const added = Array.from(fileList);
    for (const f of added) state.files.push(f);
    renderFileList();
    // 새로 고른 파일(마지막 항목)을 바로 연다
    if (added.length) openFile(added[added.length - 1]);
  }

  function renderFileList() {
    const box = $("fileList");
    if (!state.files.length) { box.innerHTML = `<div class="empty">${escapeHtml(t("list.empty"))}</div>`; return; }
    box.innerHTML = "";
    state.files.forEach((f) => {
      const div = document.createElement("div");
      div.className = "file-item" + (f === state.current ? " active" : "");
      div.innerHTML = `${escapeHtml(f.name)}<small>${formatSize(f.size)} · ${extOf(f.name).toUpperCase()}</small>`;
      div.onclick = () => openFile(f);
      box.appendChild(div);
    });
  }

  // ---------- 파일 열기 분기 ----------
  async function openFile(file) {
    const myId = ++state.renderId; // 빠르게 여러 파일을 눌러도 마지막 선택만 반영
    state.current = file;
    renderFileList();
    resetControls();
    $("exportBtn").disabled = false;
    $("viewTools").hidden = false;
    $("trMenu").hidden = true;
    state.trLang = "";
    updateTrButton();
    content.classList.remove("sheet-mode");
    state.sheetPlain = null;
    content.innerHTML = `<div class="empty">${escapeHtml(t("viewer.loading"))}</div>`;
    state.links = [];
    state.linkStatus = "loading";
    renderLinkList();
    content.style.fontSize = `${state.zoom * 100}%`;

    const ext = extOf(file.name);
    try {
      switch (ext) {
        case "pdf":  await renderPdf(file, myId); break;
        case "hwp":  await renderHwp(file); break;
        case "docx": await renderDocx(file); break;
        case "xlsx":
        case "xls":
        case "csv":  await renderSheet(file, ext); break;
        case "md":   await renderMarkdown(file); break;
        case "txt":  await renderText(file); break;
        case "png": case "jpg": case "jpeg": case "gif": case "webp":
          await renderImage(file); break;
        default:
          content.innerHTML = `<div class="error">${escapeHtml(t("error.unsupportedFormat", { ext }))}</div>`;
          state.linkStatus = "none";
          renderLinkList();
          return;
      }
      if (myId !== state.renderId) return;
      if (ext !== "pdf") { linkifyText(content); collectLinksFromDom(); }
      state.linkStatus = "done";
      renderLinkList();
    } catch (err) {
      if (myId !== state.renderId) return;
      console.error(err);
      const msg = err && err.message ? err.message : String(err);
      content.innerHTML = `<div class="error">${escapeHtml(t("error.open"))}<br>${escapeHtml(msg)}</div>`;
      state.linkStatus = "failed";
      renderLinkList();
    }
  }

  function resetControls() {
    $("docSearch").value = "";
    $("matchInfo").textContent = "";
    state.pdfPages = null; state.pdfHits = []; state.pdfCursor = -1;
    hitMarks = []; hitIndex = -1;
    $("docSearch").disabled = false;
    $("zoomIn").disabled = $("zoomOut").disabled = false;
  }

  // ---------- 포맷별 렌더러 ----------
  async function renderPdf(file, myId) {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf, ...PDF_OPTS }).promise;
    if (myId !== state.renderId) return;
    content.innerHTML = "";
    state.rawText = null;
    state.pdfPages = new Array(pdf.numPages).fill(null);
    $("docSearch").disabled = false;
    $("matchInfo").textContent = "";

    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      if (myId !== state.renderId) return;
      const viewport = page.getViewport({ scale: 1.4 * state.zoom });
      const wrap = document.createElement("div");   // 캔버스 + 하이라이트 층
      wrap.className = "pdf-wrap";
      wrap.dataset.page = String(p);
      const canvas = document.createElement("canvas");
      canvas.className = "pdf-page";
      canvas.dataset.page = String(p);
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      wrap.appendChild(canvas);
      content.appendChild(wrap);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      state.pdfPages[p - 1] = await pageIndex(page, viewport);
      if (myId === state.renderId) runPdfSearch(); // 로딩 중에도 검색 결과 갱신

      const annots = await page.getAnnotations();
      const annotated = [];
      annots.forEach((a) => {
        if (a.subtype !== "Link" || !a.url) return;
        state.links.push({ label: t("links.pageLink", { p }), url: a.url });
        const [x1, y1, x2, y2] = viewport.convertToViewportRectangle(a.rect);
        const box = { left: Math.min(x1, x2), top: Math.min(y1, y2), width: Math.abs(x2 - x1), height: Math.abs(y2 - y1) };
        annotated.push(box);
        addPdfLink(wrap, canvas, a.url, box);
      });
      addPdfTextLinks(wrap, canvas, state.pdfPages[p - 1], annotated);
    }
    dedupeLinks();
  }

  // HWP 5.x: vendor/hwp-bridge.js (hwp-convert 기반)
  async function renderHwp(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let view;
    try {
      view = HwpBridge.toView(bytes);
    } catch (err) {
      throw Object.assign(new Error(hwpErrorText(err)), { code: err.code });
    }
    content.innerHTML = DOMPurify.sanitize(view.html, { ADD_ATTR: ["target", "rel"] });
    applyI18n(content);
    state.rawText = view.text;
  }

  async function renderDocx(file) {
    const buf = await file.arrayBuffer();
    const result = await mammoth.convertToHtml({ arrayBuffer: buf });
    content.innerHTML = DOMPurify.sanitize(result.value);
    state.rawText = content.innerText;
  }

  // ---------- 엑셀: 실제 엑셀처럼 열 머리글(A,B,C)·행 번호·수식 입력줄·아래쪽 시트 탭 ----------
  const XL_MAX_ROWS = 3000, XL_MAX_COLS = 200;
  async function renderSheet(file, ext) {
    const buf = await file.arrayBuffer();
    let wb;
    if (ext === "csv") {
      wb = XLSX.read(decodeText(new Uint8Array(buf)), { type: "string" });
    } else {
      wb = XLSX.read(buf, { type: "array", cellHTML: false, cellFormula: true, cellDates: false, sheetStubs: true, cellStyles: true });
    }
    const hidden = (i) => wb.Workbook && wb.Workbook.Sheets && wb.Workbook.Sheets[i] && wb.Workbook.Sheets[i].Hidden;
    const names = wb.SheetNames.filter((_, i) => !hidden(i));
    if (!names.length) names.push(wb.SheetNames[0]);

    // 내보내기용: 모든 시트를 단순 표로 (머리글·행 번호 제외)
    const plain = document.createElement("div");
    plain.innerHTML = DOMPurify.sanitize(names.map((n) => `<h3>${escapeHtml(n)}</h3>${XLSX.utils.sheet_to_html(wb.Sheets[n], { header: "", footer: "" })}`).join(""));
    plain.querySelectorAll("table").forEach((tb) => tb.removeAttribute("id"));
    state.sheetPlain = plain;

    content.classList.add("sheet-mode");
    content.innerHTML = `<div class="xl-bar"><span class="addr">A1</span><span class="fx">fx</span><span class="val"></span></div>
      <div class="xl-grid"></div>
      <div class="xl-tabs" role="tablist"></div>`;
    const tabs = content.querySelector(".xl-tabs");
    names.forEach((name, i) => {
      const b = document.createElement("button");
      b.className = "xl-tab" + (i === 0 ? " active" : "");
      b.textContent = name;
      b.onclick = () => {
        tabs.querySelectorAll(".xl-tab").forEach((x) => x.classList.toggle("active", x === b));
        showSheet(wb.Sheets[name]);
        if (state.trLang) translateDoc(state.trLang);
        const q = $("docSearch").value.trim();
        if (q) $("docSearch").dispatchEvent(new Event("input"));
      };
      tabs.appendChild(b);
    });
    showSheet(wb.Sheets[names[0]]);
  }

  // 열 머리글 오른쪽 끝을 끌면 열 너비, 행 번호 아래쪽 끝을 끌면 행 높이 조절. 열 경계 두 번 누르면 내용에 맞춤
  function enableResize(grid, ws) {
    const table = grid.querySelector("table");
    let tip = null;
    const showTip = (x, y, text) => {
      if (!tip) { tip = document.createElement("div"); tip.className = "rz-tip"; document.body.appendChild(tip); }
      tip.textContent = text;
      tip.style.left = Math.min(x + 12, innerWidth - 90) + "px";
      tip.style.top = Math.max(y - 32, 4) + "px";
    };
    const hideTip = () => { if (tip) { tip.remove(); tip = null; } };
    const setColWidth = (c, w) => {
      const col = table.querySelectorAll("col")[c + 1];
      const old = parseFloat(col.style.width) || 0;
      col.style.width = w + "px";
      table.style.width = (parseFloat(table.style.width) + w - old) + "px";
      ws.__colW[c] = w;
    };

    grid.onpointerdown = (e) => {
      const hd = e.target.closest(".rz");
      if (!hd) return;
      e.preventDefault();
      e.stopPropagation();
      const z = state.zoom || 1;
      const th = hd.parentNode;
      hd.classList.add("active");
      hd.setPointerCapture(e.pointerId);
      let move;
      if (hd.classList.contains("rz-c")) {
        const c = +th.dataset.c;
        const w0 = parseFloat(table.querySelectorAll("col")[c + 1].style.width) || 72;
        const x0 = e.clientX;
        move = (ev) => {
          const w = Math.max(16, Math.round(w0 + (ev.clientX - x0) / z));
          setColWidth(c, w);
          showTip(ev.clientX, ev.clientY, `${colName(c)} · ${t("sheet.width")} ${w}px`);
        };
      } else {
        const tr = th.parentNode;
        const r = +th.dataset.r;
        const h0 = tr.getBoundingClientRect().height / z;
        const y0 = e.clientY;
        move = (ev) => {
          const hgt = Math.max(16, Math.round(h0 + (ev.clientY - y0) / z));
          tr.style.height = hgt + "px";
          ws.__rowH[r] = hgt;
          showTip(ev.clientX, ev.clientY, `${r + 1} · ${t("sheet.height")} ${hgt}px`);
        };
      }
      const end = () => {
        hd.classList.remove("active");
        hd.removeEventListener("pointermove", move);
        hd.removeEventListener("pointerup", end);
        hd.removeEventListener("pointercancel", end);
        hideTip();
      };
      hd.addEventListener("pointermove", move);
      hd.addEventListener("pointerup", end);
      hd.addEventListener("pointercancel", end);
    };

    // 열 경계 두 번 누르기: 그 열에서 가장 긴 내용에 맞춤 (엑셀과 같음)
    grid.ondblclick = (e) => {
      const hd = e.target.closest(".rz-c");
      if (!hd) return;
      e.preventDefault();
      const c = +hd.parentNode.dataset.c;
      let max = 24;
      grid.querySelectorAll(`td[data-c="${c}"]`).forEach((td) => {
        if (td.colSpan > 1 || !td.textContent) return;
        max = Math.max(max, td.scrollWidth + 2);
      });
      setColWidth(c, Math.min(max, 600));
    };
  }

  function colName(c) { let s = ""; c++; while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); } return s; }

  function showSheet(ws) {
    const grid = content.querySelector(".xl-grid");
    const bar = content.querySelector(".xl-bar");
    grid.scrollTop = grid.scrollLeft = 0;
    const ref = ws && ws["!ref"] ? XLSX.utils.decode_range(ws["!ref"]) : { s: { r: 0, c: 0 }, e: { r: 0, c: 0 } };
    const lastR = Math.min(ref.e.r, XL_MAX_ROWS - 1), lastC = Math.min(ref.e.c, XL_MAX_COLS - 1);
    // 엑셀처럼 빈 칸도 조금 더 보여 줌
    const nRows = Math.max(lastR + 1 + 5, 40), nCols = Math.max(lastC + 1 + 2, 12);
    const cols = (ws && ws["!cols"]) || [], rows = (ws && ws["!rows"]) || [];
    ws.__colW = ws.__colW || {}; ws.__rowH = ws.__rowH || {}; // 사용자가 바꾼 크기 (시트 탭을 바꿔도 유지)
    const colW = (c) => { if (ws.__colW[c] != null) return ws.__colW[c]; const ci = cols[c]; if (ci && ci.hidden) return 0; if (ci && ci.wpx) return ci.wpx; if (ci && ci.wch) return Math.round(ci.wch * 7 + 5); if (ci && ci.width) return Math.round(ci.width * 7); return 72; };

    // 병합 셀
    const span = new Map(), covered = new Set();
    ((ws && ws["!merges"]) || []).forEach((m) => {
      span.set(m.s.r + ":" + m.s.c, { rs: m.e.r - m.s.r + 1, cs: m.e.c - m.s.c + 1 });
      for (let r = m.s.r; r <= m.e.r; r++) for (let c = m.s.c; c <= m.e.c; c++) if (r !== m.s.r || c !== m.s.c) covered.add(r + ":" + c);
    });

    let total = 44;
    for (let c = 0; c < nCols; c++) total += colW(c);
    // 표 전체 너비를 고정해야 화면 폭에 맞춰 칸이 찌그러지지 않음 (가로 스크롤)
    let h = `<table style="width:${total}px"><colgroup><col style="width:44px">`;
    for (let c = 0; c < nCols; c++) h += `<col style="width:${colW(c)}px">`;
    h += `</colgroup><thead><tr><th class="corner"></th>`;
    for (let c = 0; c < nCols; c++) h += `<th data-c="${c}">${colName(c)}<span class="rz rz-c"></span></th>`;
    h += `</tr></thead><tbody>`;
    for (let r = 0; r < nRows; r++) {
      const ri = rows[r];
      if (ri && ri.hidden) continue;
      const hpx = ws.__rowH[r] ?? (ri && (ri.hpx || (ri.hpt && ri.hpt * 4 / 3)));
      h += `<tr${hpx ? ` style="height:${Math.round(hpx)}px"` : ""}><th data-r="${r}">${r + 1}<span class="rz rz-r"></span></th>`;
      for (let c = 0; c < nCols; c++) {
        const key = r + ":" + c;
        if (covered.has(key)) continue;
        const cell = ws && r <= lastR && c <= lastC ? ws[XLSX.utils.encode_cell({ r, c })] : null;
        const sp = span.get(key);
        const attrs = sp ? `${sp.rs > 1 ? ` rowspan="${sp.rs}"` : ""}${sp.cs > 1 ? ` colspan="${sp.cs}"` : ""}` : "";
        let cls = "", text = "";
        if (cell) {
          text = String(cell.w ?? cell.v ?? "");
          if (cell.t === "n" || cell.t === "d") cls = "num";
          else if (cell.t === "b" || cell.t === "e") cls = "ctr";
        }
        let html = escapeHtml(text);
        if (cell && cell.l && cell.l.Target && isSafeUrl(cell.l.Target)) {
          html = `<a href="${escapeHtml(cell.l.Target)}">${html || escapeHtml(cell.l.Target)}</a>`;
        }
        h += `<td data-r="${r}" data-c="${c}"${cls ? ` class="${cls}"` : ""}${attrs}>${html}</td>`;
      }
      h += `</tr>`;
    }
    h += `</tbody></table>`;
    grid.innerHTML = DOMPurify.sanitize(h);
    grid.querySelector("table").style.zoom = state.zoom;
    linkifyText(grid);

    const note = content.querySelector(".xl-note");
    if (note) note.remove();
    if (ref.e.r >= XL_MAX_ROWS || ref.e.c >= XL_MAX_COLS) {
      const n = document.createElement("div");
      n.className = "xl-note";
      n.textContent = t("sheet.truncated", { rows: XL_MAX_ROWS, cols: XL_MAX_COLS });
      grid.before(n);
    }

    // 셀 선택 → 수식 입력줄에 주소와 값/수식 표시
    const select = (td) => {
      grid.querySelectorAll("td.sel").forEach((x) => x.classList.remove("sel"));
      grid.querySelectorAll("th.hl").forEach((x) => x.classList.remove("hl"));
      td.classList.add("sel");
      const r = +td.dataset.r, c = +td.dataset.c;
      grid.querySelector(`thead th[data-c="${c}"]`)?.classList.add("hl");
      grid.querySelector(`tbody th[data-r="${r}"]`)?.classList.add("hl");
      const cell = ws && ws[XLSX.utils.encode_cell({ r, c })];
      bar.querySelector(".addr").textContent = colName(c) + (r + 1);
      bar.querySelector(".val").textContent = cell ? (cell.f ? "=" + cell.f : String(cell.v ?? "")) : "";
    };
    enableResize(grid, ws);
    grid.onclick = (e) => {
      if (e.target.closest(".rz")) return;
      if (e.target.closest("a")) return; // 링크는 바로 열기
      const td = e.target.closest("td[data-r]");
      if (td) select(td);
    };
    const first = grid.querySelector('td[data-r="0"][data-c="0"]');
    if (first) select(first);
    state.rawText = grid.innerText;
  }

  async function renderMarkdown(file) {
    const text = decodeText(new Uint8Array(await file.arrayBuffer()));
    state.rawText = text;
    content.innerHTML = DOMPurify.sanitize(marked.parse(text));
    // 외부 이미지는 자동 로딩하지 않고 주소만 표시 (보안·개인정보)
    content.querySelectorAll("img").forEach((img) => {
      const src = img.getAttribute("src") || "";
      if (/^https?:\/\//i.test(src)) {
        const span = document.createElement("span");
        span.className = "blocked-img";
        span.textContent = t("viewer.imageBlocked", { src });
        img.replaceWith(span);
      }
    });
  }

  async function renderText(file) {
    const text = decodeText(new Uint8Array(await file.arrayBuffer()));
    state.rawText = text;
    content.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
  }

  async function renderImage(file) {
    const url = URL.createObjectURL(file);
    content.innerHTML = `<img src="${url}" alt="${escapeHtml(file.name)}">`;
    state.rawText = null;
  }

  // ---------- 인코딩 판별 (UTF-8 실패 시 CP949/EUC-KR) ----------
  function decodeText(bytes) {
    try {
      return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
    } catch {
      try { return new TextDecoder("euc-kr").decode(bytes); }
      catch { return new TextDecoder("utf-8").decode(bytes); }
    }
  }

  // ---------- 본문 속 주소를 파란 링크로 (https://…, www.…, 이메일) ----------
  const URL_RE = /(https?:\/\/[^\s<>"'`]+|www\.[^\s<>"'`]+\.[^\s<>"'`]+|[\w.+-]+@[\w-]+(?:\.[\w-]+)+)/gi;
  function trimUrl(u) { return u.replace(/[).,;:!?\]}'"’”]+$/, ""); }
  function hrefOf(u) {
    if (/^https?:\/\//i.test(u)) return u;
    if (/^www\./i.test(u)) return "https://" + u;
    if (u.includes("@")) return "mailto:" + u;
    return u;
  }
  function linkifyText(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => n.parentNode && n.parentNode.closest && n.parentNode.closest("a, script, style, th, .xl-bar, .xl-tabs, textarea")
        ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
    });
    const nodes = [];
    while (walker.nextNode()) if (URL_RE.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const text = node.nodeValue;
      const frag = document.createDocumentFragment();
      let last = 0;
      text.replace(URL_RE, (m, _g, idx) => {
        const u = trimUrl(m);
        const href = hrefOf(u);
        if (!isSafeUrl(href)) return m;
        frag.appendChild(document.createTextNode(text.slice(last, idx)));
        const a = document.createElement("a");
        a.href = href;
        a.textContent = u;
        frag.appendChild(a);
        last = idx + u.length;
        return m;
      });
      if (!last) continue;
      frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  }

  function addPdfLink(wrap, canvas, url, box) {
    if (!isSafeUrl(url)) return;
    const a = document.createElement("a");
    a.className = "pdf-link";
    a.href = url;
    a.title = url;
    a.style.left = (box.left / canvas.width * 100) + "%";
    a.style.top = (box.top / canvas.height * 100) + "%";
    a.style.width = (box.width / canvas.width * 100) + "%";
    a.style.height = (box.height / canvas.height * 100) + "%";
    wrap.appendChild(a);
  }

  // PDF 본문에 글자로만 적힌 주소도 링크로 (이미 링크가 걸린 자리는 건너뜀)
  function addPdfTextLinks(wrap, canvas, pg, annotated) {
    if (!pg || !pg.text) return;
    const overlaps = (b) => annotated.some((a) => b.left < a.left + a.width && a.left < b.left + b.width && b.top < a.top + a.height && a.top < b.top + b.height);
    for (const m of pg.text.matchAll(URL_RE)) {
      const u = trimUrl(m[0]);
      const href = hrefOf(u);
      const s0 = m.index, e0 = m.index + u.length;
      for (const it of pg.items) {
        const a = Math.max(s0, it.start), b = Math.min(e0, it.start + it.len);
        if (a >= b || !it.w) continue;
        const fa = charRatio(it, a - it.start), fb = charRatio(it, b - it.start);
        const box = { left: it.x + it.w * fa, top: it.y, width: it.w * (fb - fa), height: it.h };
        if (!overlaps(box)) addPdfLink(wrap, canvas, href, box);
      }
      state.links.push({ label: u, url: href });
    }
  }

  // ---------- 링크 추출 (HTML로 렌더된 문서) ----------
  function collectLinksFromDom() {
    content.querySelectorAll("a[href]").forEach((a) => {
      state.links.push({ label: a.textContent.trim() || a.getAttribute("href"), url: a.getAttribute("href") });
    });
    if (state.rawText) {
      const matches = state.rawText.match(/https?:\/\/[^\s<>"')\]]+/g) || [];
      matches.forEach((u) => state.links.push({ label: u, url: u }));
    }
    dedupeLinks();
  }

  function dedupeLinks() {
    const seen = new Set();
    state.links = state.links.filter((l) => {
      if (seen.has(l.url)) return false;
      seen.add(l.url); return true;
    });
  }

  function renderLinkList() {
    const box = $("linkList");
    if (!box) return; // 링크 목록 패널은 없앴음: 링크는 본문에서 파랗게 표시하고 바로 열림
    if (state.linkStatus === "idle") { box.innerHTML = `<div class="empty">${escapeHtml(t("links.waiting"))}</div>`; return; }
    if (state.linkStatus === "loading") { box.innerHTML = `<div class="empty">${escapeHtml(t("links.finding"))}</div>`; return; }
    if (state.linkStatus === "failed") { box.innerHTML = `<div class="empty">${escapeHtml(t("links.failed"))}</div>`; return; }
    if (state.linkStatus === "none") { box.innerHTML = `<div class="empty">${escapeHtml(t("links.none_short"))}</div>`; return; }
    if (!state.links.length) { box.innerHTML = `<div class="empty">${escapeHtml(t("links.none"))}</div>`; return; }
    box.innerHTML = "";
    state.links.forEach((l) => {
      const div = document.createElement("div");
      div.className = "link-item";
      const safe = isSafeUrl(l.url);
      const shortener = SHORTENERS.some((s) => hostOf(l.url) === s || hostOf(l.url).endsWith("." + s));
      div.innerHTML = `
        <div class="label">${escapeHtml(l.label)}</div>
        <div class="url">${escapeHtml(l.url)}</div>
        ${shortener ? `<div class="tag">${escapeHtml(t("links.shortener"))}</div>` : ""}
        ${safe ? "" : `<div class="tag">${escapeHtml(t("links.blocked"))}</div>`}
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="open-btn" ${safe ? "" : "disabled"}>${escapeHtml(t("links.open"))}</button>
          <button class="ghost copy-btn">${escapeHtml(t("links.copy"))}</button>
        </div>`;
      div.querySelector(".open-btn").onclick = () => openExternal(l.url);
      div.querySelector(".copy-btn").onclick = async () => {
        try { await navigator.clipboard.writeText(l.url); alert(t("links.copied")); }
        catch { alert(t("links.copyFail")); }
      };
      box.appendChild(div);
    });
  }

  function isSafeUrl(url) {
    try { return ALLOWED_PROTOCOLS.includes(new URL(url, "https://dummy.invalid").protocol); }
    catch { return false; }
  }
  function hostOf(url) {
    try { return new URL(url).hostname; } catch { return ""; }
  }

  // ---------- 문서 번역 (한국어·영어·중국어·일본어) ----------
  // 기본: MyMemory 무료 번역(가입 없음, 하루 약 5천 자). 설정에서 Google 번역 API 키를 넣으면 Google 사용.
  const TR_LANGS = { ko: "한국어", en: "English", "zh-CN": "中文", ja: "日本語" };
  const trCache = new Map();
  let trJob = 0;
  const trKey = () => { try { return localStorage.getItem("viewer.trKey") || ""; } catch { return ""; } };

  function updateTrButton() {
    $("trBtn").textContent = state.trLang ? "🌐 " + TR_LANGS[state.trLang] : t("tr.button");
    $("trMenu").querySelectorAll("button[data-tr]").forEach((b) => b.classList.toggle("on", b.dataset.tr === (state.trLang || "")));
  }
  function trStatus(msg) { $("trStatus").textContent = msg || ""; }

  // 글자 종류로 원문 언어 추정 (MyMemory 는 원문 언어를 지정해야 함)
  function guessLang(s) {
    if (/[\uac00-\ud7a3]/.test(s)) return "ko";
    if (/[\u3040-\u30ff]/.test(s)) return "ja";
    if (/[\u4e00-\u9fff]/.test(s)) return "zh-CN";
    return "en";
  }
  const needsTr = (s, target) => /\p{L}/u.test(s) && !/^\s*(https?:\/\/|www\.|[\w.+-]+@)\S+\s*$/i.test(s) && guessLang(s) !== target;

  async function trGoogle(texts, target) {
    const out = [];
    for (let i = 0; i < texts.length;) {
      const batch = [];
      let len = 0;
      while (i < texts.length && batch.length < 100 && len + texts[i].length < 4500) { len += texts[i].length; batch.push(texts[i++]); }
      if (!batch.length) batch.push(texts[i++]);
      const res = await fetch("https://translation.googleapis.com/language/translate/v2?key=" + encodeURIComponent(trKey()), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ q: batch, target, format: "text" }),
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((j.error && j.error.message) || "HTTP " + res.status);
      j.data.translations.forEach((x) => out.push(x.translatedText));
    }
    return out;
  }

  async function trMyMemoryOne(text, target) {
    const src = guessLang(text);
    if (src === target) return text;
    // MyMemory 는 한 번에 500바이트까지: 문장 단위로 나눠 보냄
    const parts = [];
    let cur = "";
    for (const piece of text.split(/(?<=[.!?。！？\n])\s*/)) {
      if (new TextEncoder().encode(cur + piece).length > 450 && cur) { parts.push(cur); cur = ""; }
      cur += (cur ? " " : "") + piece;
    }
    if (cur) parts.push(cur);
    const done = [];
    for (const part of parts) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(part)}&langpair=${src}|${target}`;
      const res = await fetch(url);
      const j = await res.json().catch(() => ({}));
      const txt = j && j.responseData && j.responseData.translatedText;
      if (!res.ok || !txt || j.quotaFinished || /MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(txt)) {
        throw new Error(j.quotaFinished || /MYMEMORY WARNING/i.test(txt || "") ? t("tr.quota") : (j.responseDetails || "HTTP " + res.status));
      }
      done.push(txt);
    }
    return done.join(" ");
  }

  async function translateTexts(texts, target, onProgress) {
    const todo = [...new Set(texts.filter((s) => needsTr(s, target) && !trCache.has(target + "\u0000" + s)))];
    let n = 0;
    if (todo.length) {
      if (trKey()) {
        const out = await trGoogle(todo, target);
        todo.forEach((s, i) => trCache.set(target + "\u0000" + s, out[i]));
        onProgress(1);
      } else {
        // 동시에 4개씩
        let idx = 0, failed = null;
        const worker = async () => {
          while (idx < todo.length && !failed) {
            const s = todo[idx++];
            try { trCache.set(target + "\u0000" + s, await trMyMemoryOne(s, target)); }
            catch (e) { failed = e; }
            onProgress(++n / todo.length);
          }
        };
        await Promise.all([worker(), worker(), worker(), worker()]);
        if (failed) throw failed;
      }
    }
    return texts.map((s) => trCache.get(target + "\u0000" + s) ?? s);
  }

  // 화면의 글자 마디(text node)를 모아 번역문으로 바꿈. 원문은 노드에 보관해 되돌릴 수 있게 함
  function textNodesOf(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => n.parentNode && n.parentNode.closest && n.parentNode.closest("script, style, .xl-grid th, .xl-bar, .xl-tabs, .tr-pages, #viewTools")
        ? NodeFilter.FILTER_REJECT : (n.__orig != null || n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT),
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    return nodes;
  }

  function restoreOriginal() {
    textNodesOf(content).forEach((n) => { if (n.__orig != null) { n.nodeValue = n.__orig; n.__orig = null; } });
    content.querySelectorAll(".tr-pages").forEach((el) => el.remove());
    content.querySelectorAll(".pdf-wrap").forEach((el) => { el.hidden = false; });
    if (content.classList.contains("sheet-mode")) state.rawText = content.querySelector(".xl-grid").innerText;
    else if (!content.querySelector(".pdf-wrap") && state.rawText != null) state.rawText = content.innerText;
  }

  async function translateDoc(target) {
    const job = ++trJob;
    clearTextHits(); $("docSearch").value = ""; $("matchInfo").textContent = "";
    restoreOriginal();
    state.trLang = target;
    updateTrButton();
    if (!target) { trStatus(""); return; }
    const pct = (f) => { const m = t("tr.progress", { p: Math.round(f * 100) }); trStatus(m); if (job === trJob) $("trBtn").textContent = "🌐 " + m; };
    pct(0);
    try {
      if (content.querySelector(".pdf-wrap")) {
        // PDF 는 그림(캔버스)이라 글자를 바꿀 수 없음 → 페이지별 번역문을 대신 보여 줌
        const pdf = await pdfjsLib.getDocument({ data: await state.current.arrayBuffer(), ...PDF_OPTS }).promise;
        const pages = [];
        for (let p = 1; p <= pdf.numPages; p++) pages.push(await pageLines(await pdf.getPage(p)));
        const flat = pages.flat();
        if (!flat.length) throw new Error(t("tr.noText"));
        const out = await translateTexts(flat, target, pct);
        if (job !== trJob) return;
        let k = 0;
        const box = document.createElement("div");
        box.className = "tr-pages";
        box.innerHTML = pages.map((lines, i) => `<div class="tr-page"><h4>${escapeHtml(t("code.page", { n: i + 1 }))}</h4>${lines.map(() => `<p>${escapeHtml(out[k++])}</p>`).join("")}</div>`).join("");
        content.querySelectorAll(".pdf-wrap").forEach((el) => { el.hidden = true; });
        content.appendChild(box);
        linkifyText(box);
      } else {
        const nodes = textNodesOf(content);
        const texts = nodes.map((n) => n.nodeValue);
        if (!texts.some((s) => /\p{L}/u.test(s))) throw new Error(t("tr.noText"));
        const out = await translateTexts(texts.map((s) => s.trim()), target, pct);
        if (job !== trJob) return;
        nodes.forEach((n, i) => {
          const orig = n.nodeValue;
          const lead = orig.match(/^\s*/)[0], tail = orig.match(/\s*$/)[0];
          if (out[i] !== orig.trim()) { n.__orig = orig; n.nodeValue = lead + out[i] + tail; }
        });
        state.rawText = content.innerText;
      }
      trStatus(trKey() ? t("tr.doneGoogle") : t("tr.doneFree"));
      updateTrButton();
    } catch (e) {
      if (job !== trJob) return;
      restoreOriginal();
      state.trLang = "";
      updateTrButton();
      trStatus(t("tr.fail", { msg: e && e.message ? e.message : String(e) }));
      $("trMenu").hidden = false;
    }
  }

  $("trBtn").onclick = (e) => { e.stopPropagation(); $("trMenu").hidden = !$("trMenu").hidden; };
  document.addEventListener("click", (e) => { if (!e.target.closest("#viewTools")) $("trMenu").hidden = true; });
  $("trMenu").querySelectorAll("button[data-tr]").forEach((b) => {
    b.onclick = () => {

  // ---------- 확대/축소 & 테마 ----------

  function loadImage(file) {
    return new Promise((resolve, reject) => {

      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(t("error.imageOpen"))); };
      img.src = url;

  }

  function showReadResults(list, sourceName) {

  async function readImageFile(file, where) {
    const img = await loadImage(file);
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext("2d").drawImage(img, 0, 0);
    const r = CodeTools.readFromCanvas(c);
    return r ? [{ where, ...r }] : [];
  }

  $("readCurrent").onclick = async () => {

  // ---------- 카메라 실시간 스캔 ----------
  // 기기 내장 BarcodeDetector(빠름)를 먼저 쓰고, 없으면 CodeTools(zxing)로 프레임을 해석
  const DETECTOR_FORMATS = {
    qr_code: "QR Code", ean_13: "EAN-13", ean_8: "EAN-8", code_128: "Code 128", code_39: "Code 39",
    code_93: "Code 93", codabar: "Codabar", data_matrix: "Data Matrix", itf: "ITF",
    upc_a: "UPC-A", upc_e: "UPC-E", pdf417: "PDF417", aztec: "Aztec",
  };
  const scan = { stream: null, timer: 0, detector: null, canvas: null, torch: false };

  async function getDetector() {
    if (scan.detector !== null) return scan.detector;
    scan.detector = false;
    try {
      if ("BarcodeDetector" in window) {
        const supported = await BarcodeDetector.getSupportedFormats();
        const formats = Object.keys(DETECTOR_FORMATS).filter((f) => supported.includes(f));
        if (formats.length) scan.detector = new BarcodeDetector({ formats });
      }
    } catch { scan.detector = false; }
    return scan.detector;
  }

  function stopScan() {
    clearTimeout(scan.timer);
    scan.timer = 0;
    if (scan.stream) scan.stream.getTracks().forEach((tr) => tr.stop());
    scan.stream = null;
    scan.torch = false;
    const v = $("scanVideo");
    if (v) v.srcObject = null;
    if ($("scanBox")) $("scanBox").hidden = true;
    if ($("scanBtn")) $("scanBtn").hidden = false;
  }

  async function decodeFrame(video) {
    const det = await getDetector();
    if (det) {
      try {
        const codes = await det.detect(video);
        if (codes.length) return { text: codes[0].rawValue, format: DETECTOR_FORMATS[codes[0].format] || codes[0].format };
      } catch { /* 다음 프레임에서 다시 시도 */ }
      return null;
    }
    // zxing 경로: 프레임을 최대 960px로 줄여 캔버스에 그린 뒤 해석
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return null;
    const k = Math.min(1, 960 / Math.max(w, h));
    const c = scan.canvas || (scan.canvas = document.createElement("canvas"));
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d", { willReadFrequently: true }).drawImage(video, 0, 0, c.width, c.height);
    try { return CodeTools.readFromCanvas(c); } catch { return null; }
  }

  async function scanLoop() {
    if (!scan.stream) return;
    const video = $("scanVideo");
    const r = video.readyState >= 2 ? await decodeFrame(video) : null;
    if (!scan.stream) return;
    if (r && r.text) {
      stopScan();
      if (navigator.vibrate) navigator.vibrate(80);
      showReadResults([{ where: t("code.source.camera"), ...r }], t("code.source.camera"));
      return;
    }
    scan.timer = setTimeout(scanLoop, 150);
  }

  function cameraErrorText(e) {
    const name = e && e.name;
    if (name === "NotAllowedError" || name === "SecurityError") return t("code.cam.denied");
    if (name === "NotFoundError" || name === "OverconstrainedError") return t("code.cam.notFound");
    return t("code.cam.error", { msg: (e && e.message) || String(e) });
  }

  $("scanBtn").onclick = async () => {
    $("readResults").innerHTML = "";
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $("readResults").innerHTML = `<div class="error">${escapeHtml(t("code.cam.unsupported"))}</div>`;
      return;
    }
    stopScan();
    try {
      scan.stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      });
    } catch (e) {
      $("readResults").innerHTML = `<div class="error">${escapeHtml(cameraErrorText(e))}</div>`;
      return;
    }
    const video = $("scanVideo");
    video.srcObject = scan.stream;
    $("scanBox").hidden = false;
    $("scanBtn").hidden = true;
    try { await video.play(); } catch { /* autoplay muted 로 재생됨 */ }
    // 플래시 지원 기기에서만 버튼 표시
    const track = scan.stream.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : {};
    $("scanTorch").hidden = !caps.torch;
    scanLoop();
  };
  $("scanStop").onclick = () => stopScan();
  $("scanTorch").onclick = async () => {
    const track = scan.stream && scan.stream.getVideoTracks()[0];
    if (!track) return;
    scan.torch = !scan.torch;
    try { await track.applyConstraints({ advanced: [{ torch: scan.torch }] }); } catch { scan.torch = false; }
  };

  // 생성 탭: 형식 목록은 현재 언어로 다시 채움
  function rebuildCodeTypes() {
    const typeSel = $("codeType");
    const current = typeSel.value;
    typeSel.innerHTML = "";
    Object.keys(CodeTools.GENERATE_TYPES).forEach((key) => {
      const o = document.createElement("option");
      o.value = key; o.textContent = t("code.type." + key);
      typeSel.appendChild(o);
    });
    if (current) typeSel.value = current;
  }
  rebuildCodeTypes();

  let lastCode = null;
  $("makeBtn").onclick = () => {
    $("makeMsg").textContent = "";
    try {
      lastCode = CodeTools.generate($("codeType").value, $("codeText").value);
      const box = $("makePreview");
      box.innerHTML = "";
      lastCode.style.maxWidth = "100%";
      box.appendChild(lastCode);
      $("makeDownload").disabled = false;
    } catch (e) {
      $("makeMsg").textContent = codeErrorText(e);
    }
  };
  $("makeDownload").onclick = () => {
    if (!lastCode) return;
    const a = document.createElement("a");
    a.download = `code-${$("codeType").value}.png`;
    a.href = lastCode.toDataURL("image/png");
    a.click();

  // ---------- 내보내기 · 인쇄 · 전송 (vendor/export.js: ExportTools) ----------
  const IMAGE_EXTS = ["png", "jpg", "jpeg", "gif", "webp"];
  const exportDialog = $("exportDialog");

  function baseName(name) { return name.replace(/\.[^.]+$/, "") || "document"; }

  function setExportMsg(text, isError) {
    const el = $("exportMsg");
    el.textContent = text;
    el.style.color = isError ? "#dc2626" : "var(--muted)";
  }

  // 현재 파일에서 내보낼 형식 목록 (파일 종류에 따라 다름)
  function availableFormats(ext) {
    if (IMAGE_EXTS.includes(ext)) return ["png", "pdf", "original"];
    if (ext === "pdf") return ["txt", "md", "html", "docx", "csv", "xlsx", "png", "pdf", "original"];
    return ["txt", "md", "html", "docx", "csv", "xlsx", "pdf", "original"];
  }

  function fillFormatSelect() {
    const sel = $("exportFormat");
    const ext = extOf(state.current.name);
    sel.innerHTML = availableFormats(ext)
      .map((f) => `<option value="${f}">${escapeHtml(t("export.fmt." + f))}</option>`).join("");
  }

  // DOM을 공통 문서 모델 블록으로 변환 (제목, 문단, 표)
  function domBlocks(root) {
    const blocks = [];
    const walk = (el) => {
      for (const node of el.children) {
        const tag = node.tagName;
        if (/^H[1-6]$/.test(tag)) {
          const text = node.textContent.trim();
          if (text) blocks.push({ t: "h", level: Number(tag[1]), text });
        } else if (tag === "TABLE") {
          const rows = Array.from(node.rows).map((r) => Array.from(r.cells).map((c) => c.textContent.trim()));
          if (rows.length) blocks.push({ t: "table", rows });
        } else if (tag === "PRE") {
          node.textContent.split("\n").forEach((line) => { if (line.trim()) blocks.push({ t: "p", text: line.trim() }); });
        } else if (node.querySelector("table, h1, h2, h3, h4, h5, h6, p, div, li, pre")) {
          walk(node);
        } else {
          const text = node.textContent.trim();
          if (text) blocks.push({ t: "p", text });
        }
      }
    };
    walk(root);
    return blocks;
  }

  // PDF 텍스트 추출 (스캔본처럼 텍스트가 없으면 빈 배열)
  async function pdfBlocks(file) {
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer(), ...PDF_OPTS }).promise;
    const blocks = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const lines = await pageLines(await pdf.getPage(p));
      lines.forEach((text) => blocks.push({ t: "p", text }));
    }
    return blocks;
  }

  // PDF 한 페이지의 텍스트 줄 목록 (hasEOL 기준으로 줄 나눔)
  async function pageLines(page) {
    const tc = await page.getTextContent();
    const lines = [];
    let line = "";
    for (const item of tc.items) {
      line += item.str;
      if (item.hasEOL) { if (line.trim()) lines.push(line.trim()); line = ""; }
    }
    if (line.trim()) lines.push(line.trim());
    return lines;
  }

  // 글꼴 측정으로 글자 위치 비율 계산 (글자마다 폭이 달라서 균등 분할은 어긋남)
  const measureCtx = document.createElement("canvas").getContext("2d");
  function charRatio(it, n) {
    if (n <= 0) return 0;
    if (n >= it.str.length) return 1;
    measureCtx.font = `${it.h}px ${it.family}`;
    const total = measureCtx.measureText(it.str).width;
    const prefix = measureCtx.measureText(it.str.slice(0, n)).width;
    return total > 0 ? prefix / total : n / it.str.length;
  }

  // PDF 페이지의 글자 위치 계산: 검색용 전체 텍스트 + 글자 상자(화면 좌표)
  async function pageIndex(page, viewport) {
    const tc = await page.getTextContent();
    let text = "";
    const items = [];
    for (const item of tc.items) {
      if (item.str) {
        const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
        const h = Math.hypot(tx[2], tx[3]);
        const family = (tc.styles && tc.styles[item.fontName] && tc.styles[item.fontName].fontFamily) || "sans-serif";
        items.push({ start: text.length, len: item.str.length, str: item.str, family, x: tx[4], y: tx[5] - h, w: item.width * viewport.scale, h });
        text += item.str;
      }
      if (item.hasEOL) text += " ";
    }
    return { text, items };
  }

  // PDF 본문 검색: 페이지별 텍스트에서 찾고, 일치 위치를 기록하며 하이라이트 갱신
  function runPdfSearch() {
    const q = $("docSearch").value.trim().toLowerCase();
    state.pdfHits = [];
    state.pdfCursor = -1;
    const pages = state.pdfPages || [];
    if (!q) { $("matchInfo").textContent = ""; drawPdfHighlights(); return; }
    if (pages.every((pg) => !pg || !pg.text.trim())) { $("matchInfo").textContent = t("search.pdfNoText"); drawPdfHighlights(); return; }
    pages.forEach((pg, i) => {
      if (!pg) return;
      const lower = pg.text.toLowerCase();
      let at = lower.indexOf(q);
      while (at !== -1) { state.pdfHits.push({ page: i + 1, start: at, len: q.length }); at = lower.indexOf(q, at + q.length); }
    });
    drawPdfHighlights();
    if (!state.pdfHits.length) { $("matchInfo").textContent = t("search.noMatch"); return; }
    const uniquePages = [...new Set(state.pdfHits.map((h) => h.page))].join(", ");
    $("matchInfo").textContent = t("search.pdfResult", { n: state.pdfHits.length, pages: uniquePages });
  }

  // 일치 위치를 글자 상자 단위로 나눠 캔버스 위에 그림 (퍼센트 좌표라 확대/축소해도 맞음)
  function drawPdfHighlights() {
    content.querySelectorAll(".pdf-hit").forEach((el) => el.remove());
    state.pdfHits.forEach((hit, idx) => {
      const pg = state.pdfPages && state.pdfPages[hit.page - 1];
      const wrap = content.querySelector(`.pdf-wrap[data-page="${hit.page}"]`);
      const canvas = wrap && wrap.querySelector("canvas.pdf-page");
      if (!pg || !canvas) return;
      const vw = canvas.width, vh = canvas.height;
      const s = hit.start, e = hit.start + hit.len;
      for (const it of pg.items) {
        const a = Math.max(s, it.start), b = Math.min(e, it.start + it.len);
        if (a >= b || !it.w) continue;
        const fa = charRatio(it, a - it.start), fb = charRatio(it, b - it.start);
        const left = it.x + it.w * fa;
        const width = it.w * (fb - fa);
        const div = document.createElement("div");
        div.className = "pdf-hit" + (idx === state.pdfCursor ? " current" : "");
        div.style.left = (left / vw * 100) + "%";
        div.style.top = (it.y / vh * 100) + "%";
        div.style.width = (width / vw * 100) + "%";
        div.style.height = (it.h / vh * 100) + "%";
        wrap.appendChild(div);
      }
    });
  }

  // Enter: 다음 일치 위치로 이동
  function jumpToNextPdfHit() {
    if (!state.pdfHits.length) return;
    state.pdfCursor = (state.pdfCursor + 1) % state.pdfHits.length;
    drawPdfHighlights();
    const cur = content.querySelector(".pdf-hit.current");
    if (cur) cur.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  // 텍스트 문서 검색: 표시된 DOM의 글자를 <mark>로 감싸서 하이라이트
  function clearTextHits() {
    content.querySelectorAll("mark.hit").forEach((m) => m.replaceWith(document.createTextNode(m.textContent)));
    content.normalize();
    hitMarks = [];
    hitIndex = -1;
  }

  function markTextHits(q) {
    clearTextHits();
    if (!q) return;
    const needle = q.toLowerCase();
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) {
      const parent = walker.currentNode.parentNode;
      if (parent && /^(SCRIPT|STYLE)$/.test(parent.nodeName)) continue;
      if (parent && parent.closest && parent.closest(".xl-grid th, .xl-bar, .xl-tabs")) continue;
      nodes.push(walker.currentNode);
    }
    for (const node of nodes) {
      const text = node.nodeValue;
      const lower = text.toLowerCase();
      let idx = lower.indexOf(needle);
      if (idx === -1) continue;
      const frag = document.createDocumentFragment();
      let last = 0;
      while (idx !== -1) {
        frag.appendChild(document.createTextNode(text.slice(last, idx)));
        const mark = document.createElement("mark");
        mark.className = "hit";
        mark.textContent = text.slice(idx, idx + needle.length);
        frag.appendChild(mark);
        hitMarks.push(mark);
        last = idx + needle.length;
        idx = lower.indexOf(needle, last);
      }
      frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  }

  // step: +1 다음, -1 이전. 끝에 도달하면 처음/끝으로 순환
  function goToTextHit(step) {
    if (!hitMarks.length) return;
    if (hitIndex >= 0) hitMarks[hitIndex].classList.remove("current");
    if (hitIndex < 0) hitIndex = step > 0 ? 0 : hitMarks.length - 1;
    else hitIndex = (hitIndex + step + hitMarks.length) % hitMarks.length;
    const m = hitMarks[hitIndex];
    m.classList.add("current");
    m.scrollIntoView({ block: "center", behavior: "smooth" });
    $("matchInfo").textContent = t("search.textResult", { i: hitIndex + 1, n: hitMarks.length });
  }


  async function buildModel() {
    const file = state.current;
    const ext = extOf(file.name);
    const blocks = ext === "pdf" ? await pdfBlocks(file) : domBlocks(state.sheetPlain || content);
    return { title: baseName(file.name), blocks };
  }

  // 페이지 이미지 (PDF 캔버스 또는 이미지 파일) → PNG dataURL 목록
  async function pageImages() {
    const ext = extOf(state.current.name);
    if (ext === "pdf") return Array.from(content.querySelectorAll("canvas.pdf-page")).map((cv) => cv.toDataURL("image/png"));
    if (IMAGE_EXTS.includes(ext)) {
      const img = await loadImage(state.current);
      const cv = document.createElement("canvas");
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      cv.getContext("2d").drawImage(img, 0, 0);
      return [cv.toDataURL("image/png")];
    }
    return [];
  }

  const native = () => window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  function blobToBase64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(",")[1] || "");
      r.onerror = () => rej(r.error);
      r.readAsDataURL(blob);
    });
  }
  async function nativeIO(method, blob, name, extra) {
    const data = blob ? await blobToBase64(blob) : undefined;
    return window.Capacitor.nativePromise("NativeIO", method, { name, mime: ((blob && blob.type) || "application/octet-stream").split(";")[0], data, ...extra });
  }
  // 앱(WebView)에서는 <a download> 가 동작하지 않으므로 다운로드 폴더에 직접 저장
  async function saveOutput(blob, name) {
    if (native()) {
      try {
        const r = await nativeIO("save", blob, name);
        setExportMsg(r && r.folder ? t("export.savedTo", { name: r.name, folder: r.folder }) : t("export.saved", { name }));
      } catch (e) {
        if (e && e.code === "CANCELLED") return;
        throw e;
      }
      return;
    }
    saveBlob(blob, name);
  }

  function saveBlob(blob, name) {
    const a = document.createElement("a");
    const url = URL.createObjectURL(blob);
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // 형식별 결과물 생성. 인쇄(pdf)는 별도 경로이므로 여기서는 null 반환
  async function makeOutput(fmt) {
    const file = state.current;
    const name = baseName(file.name);
    if (fmt === "original") return { blob: file, name: file.name };
    if (fmt === "png") {
      const imgs = await pageImages();
      if (!imgs.length) throw new Error(t("export.noPng"));
      const loaded = await Promise.all(imgs.map((src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.src = src; })));
      const width = Math.max(...loaded.map((i) => i.naturalWidth));
      const height = loaded.reduce((sum, i) => sum + i.naturalHeight, 0);
      const cv = document.createElement("canvas");
      cv.width = width; cv.height = height;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, width, height);
      let y = 0;
      for (const i of loaded) { ctx.drawImage(i, 0, y); y += i.naturalHeight; }
      const blob = await new Promise((res) => cv.toBlob(res, "image/png"));
      return { blob, name: name + ".png" };
    }
    const model = await buildModel();
    if (!model.blocks.length) throw new Error(t("export.noText"));
    const text = (s, type) => new Blob([s], { type: type + ";charset=utf-8" });
    switch (fmt) {
      case "txt":  return { blob: text(ExportTools.toText(model), "text/plain"), name: name + ".txt" };
      case "md":   return { blob: text(ExportTools.toMarkdown(model), "text/markdown"), name: name + ".md" };
      case "html": return { blob: text(ExportTools.toHtml(model), "text/html"), name: name + ".html" };
      case "csv": {
        const tables = ExportTools.tablesOf(model);
        if (!tables.length) throw new Error(t("export.noText"));
        const rows = tables.flatMap((rws, i) => (i ? [[], ...rws] : rws));
        return { blob: text(ExportTools.toCsv(rows), "text/csv"), name: name + ".csv" };
      }
      case "xlsx": {
        // 숫자처럼 보이는 셀은 숫자로 저장 (합계 계산 가능). 0으로 시작하는 코드(예: 0123)는 문자로 유지
        const toCell = (c) => (/^-?(0|[1-9]\d*)(\.\d+)?$/.test(c) ? Number(c) : c);
        const sheetModel = { ...model, blocks: model.blocks.map((b) => (b.t === "table" ? { ...b, rows: b.rows.map((r) => r.map(toCell)) } : b)) };
        return { blob: new Blob([ExportTools.toXlsx(sheetModel)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), name: name + ".xlsx" };
      }
      case "docx": return { blob: await ExportTools.toDocx(model), name: name + ".docx" };
      default: throw new Error("unknown format: " + fmt);
    }
  }

  // 인쇄: 숨은 iframe에 문서를 넣고 인쇄 대화상자 호출 (PDF 저장도 여기서)
  async function printCurrent() {
    const ext = extOf(state.current.name);
    let html;
    if (ext === "pdf" || IMAGE_EXTS.includes(ext)) {
      const imgs = await pageImages();
      html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>@page{margin:10mm}body{margin:0}img{display:block;width:100%;page-break-after:always}</style></head><body>${imgs.map((s) => `<img src="${s}">`).join("")}</body></html>`;
    } else {
      const model = await buildModel();
      if (!model.blocks.length) throw new Error(t("export.noText"));
      html = ExportTools.toHtml(model);
    }
    if (native()) { await window.Capacitor.nativePromise("NativeIO", "print", { html, name: baseName(state.current.name) }); return; }
    const frame = document.createElement("iframe");
    frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(frame);
    frame.onload = () => {
      setTimeout(() => {
        try { frame.contentWindow.focus(); frame.contentWindow.print(); } finally { setTimeout(() => frame.remove(), 1000); }
      }, 200);
    };
    frame.srcdoc = html;
  }

  // 메일·공유: 기기가 파일 공유를 지원하면 공유 시트, 아니면 저장 후 메일 앱 열기
  async function sendCurrent(fmt) {
    const { blob, name } = await makeOutput(fmt);
    if (native()) { await nativeIO("share", blob, name, { title: t("export.send") }); return; }
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    saveBlob(blob, name);
    setExportMsg(t("send.noShare"));
    location.href = `mailto:?subject=${encodeURIComponent(name)}&body=${encodeURIComponent(t("send.mailBody", { name }))}`;
  }

  // 공통 실행 래퍼: 진행 표시와 오류 표시
  async function runExport(fn) {
    setExportMsg(t("export.busy"));
    try {
      await fn();
      // 진행 문구만 지우고, 이후 안내(예: 메일 앱 안내)는 유지
      if ($("exportMsg").textContent === t("export.busy")) setExportMsg("");
    }
    catch (e) { console.error(e); setExportMsg(e && e.message ? e.message : String(e), true); }
  }

  $("exportBtn").onclick = () => {
    if (!state.current) return;
    fillFormatSelect();
    setExportMsg("");
    exportDialog.showModal();
  };
  $("exportClose").onclick = () => exportDialog.close();
  $("exportRun").onclick = () => runExport(async () => {
    if ($("exportFormat").value === "pdf") { await printCurrent(); setExportMsg(t(native() ? "export.pdfHintApp" : "export.pdfHint")); return; }
    const { blob, name } = await makeOutput($("exportFormat").value);
    await saveOutput(blob, name);
  });
  $("exportPrint").onclick = () => runExport(printCurrent);
  $("exportSend").onclick = () => {
    if ($("exportFormat").value === "pdf") { setExportMsg(t("export.pdfHint")); return; }
    runExport(() => sendCurrent($("exportFormat").value));
  };
  $("exportFax").onclick = () => setExportMsg(t("export.faxNote"));

  // ---------- 유틸 ----------
  function extOf(name) { return (name.split(".").pop() || "").toLowerCase(); }
  function formatSize(b) {
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
    return (b / 1048576).toFixed(1) + " MB";
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- 초기화 ----------
  $("langSel").value = lang;
  setLanguage(lang);
})();
</script>
</body>
</html>
