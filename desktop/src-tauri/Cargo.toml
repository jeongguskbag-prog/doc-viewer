[package]
name = "doc-viewer"
version = "2.9.0"
description = "Document Viewer (문서 통합 뷰어) for Windows"
edition = "2021"
publish = false

[lib]
name = "doc_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
# 작은 실행 파일
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
