name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor and document libraries (bundled into the APK for offline use)
        run: |
          npm install --no-audit --no-fund
          test -f android/app/src/main/assets/public/lib/pdfjs/pdf.worker.min.js
          test -f android/app/src/main/assets/public/lib/xlsx.full.min.js
          ls android/app/src/main/assets/public/lib/pdfjs/cmaps | wc -l

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build standard APK
        working-directory: android
        run: |
          chmod +x gradlew
          node ../scripts/write-config.js standard
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../DocumentViewer.apk

      # 기관용: 망분리(보안) 모드가 항상 켜져 있고 끌 수 없는 배포판
      - name: Build institutional air-gapped APK
        working-directory: android
        run: |
          node ../scripts/write-config.js airgap
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../DocumentViewer-Airgap.apk
          node ../scripts/write-config.js standard

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DocumentViewer
          path: |
            DocumentViewer.apk
            DocumentViewer-Airgap.apk

      # gh CLI 로 올리고, 일시적인 GitHub 오류에 대비해 최대 4번 재시도
      - name: Publish APKs to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="문서 뷰어 최신 APK (커밋 ${GITHUB_SHA})
          - DocumentViewer.apk: 일반판
          - DocumentViewer-Airgap.apk: 기관용 망분리판 (외부 통신 차단, 끌 수 없음)
          - DocumentViewer-Setup.exe / DocumentViewer-Portable.zip: 윈도우 PC (설치형 / 설치 없이 실행)
          - DocumentViewer-Airgap-Setup.exe / DocumentViewer-Airgap-Portable.zip: 윈도우 PC 기관용 망분리판"
          for i in 1 2 3 4; do
            if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload latest DocumentViewer.apk DocumentViewer-Airgap.apk --clobber --repo "$GITHUB_REPOSITORY" \
                && gh release edit latest --title "문서 뷰어 (Document Viewer)" --notes "$notes" --latest --repo "$GITHUB_REPOSITORY" && exit 0
            else
              gh release create latest DocumentViewer.apk DocumentViewer-Airgap.apk --title "문서 뷰어 (Document Viewer)" --notes "$notes" --latest --repo "$GITHUB_REPOSITORY" && exit 0
            fi
            echo "publish attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
