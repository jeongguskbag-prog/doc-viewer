name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor (provides android/capacitor-android module)
        run: npm install --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DocumentViewer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentViewer
          path: DocumentViewer.apk

      - name: Publish APK to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 문서 뷰어 (Document Viewer)
          make_latest: true
          files: DocumentViewer.apk
          body: |
            문서 뷰어 최신 APK (커밋 ${{ github.sha }})
